<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <title>AI Predictive Maintenance System</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="{{ url_for('static', filename='js/chart.js') }}"></script>

</head>

<body>

<div class="main-container">

    <!-- HEADER -->
    <div class="header">
        <h1 class="site-title">
            AI Predictive Maintenance System
        </h1>

        <p class="subtitle">
            Smart Monitoring • Failure Prediction • Industrial Intelligence
        </p>
    </div>


    <!-- FORM CARD -->
    <div class="card">

        <h2>Machine Sensor Input</h2>

        <!-- FIXED: action="/" -->
        <form action="/" method="post">

            <!-- NEW: Machine ID -->
            <div class="input-group">
                <label>Machine ID</label>
                <input type="text" name="machine_id" required>
            </div>

            <div class="input-group">
                <label>Temperature (°C)</label>
                <input type="number" step="any" name="temperature" required>
            </div>

            <div class="input-group">
                <label>Vibration (Hz)</label>
                <input type="number" step="any" name="vibration" required>
            </div>

            <div class="input-group">
                <label>Pressure (Pa)</label>
                <input type="number" step="any" name="pressure" required>
            </div>

            <button type="submit" class="btn">
                Analyze Machine
            </button>

        </form>

    </div>


    <!-- RESULT CARD -->
    {% if result %}

    <div class="card result-card">

        {% if "Failure" in result %}
            <h2 class="fail">{{ result }}</h2>
        {% else %}
            <h2 class="safe">{{ result }}</h2>
        {% endif %}

        <canvas id="machineChart"></canvas>

    </div>

    <script>
        createChart(
            {{ temperature }},
            {{ vibration }},
            {{ pressure }}
        );
    </script>

    {% endif %}


    <!-- FOOTER -->
    <div class="footer">
        Powered by AI • Predictive Analytics • Real-Time Monitoring
    </div>

</div>

</body>
</html>
