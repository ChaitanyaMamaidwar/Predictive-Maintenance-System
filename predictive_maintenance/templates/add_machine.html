{% extends "base.html" %}
{% block title %}Add Machine{% endblock %}
{% block content %}
<section class="panel">
  <h2>Add New Machine</h2>
  <p class="muted">Enter machine info and its baseline sensor values.</p>

  <form method="POST" class="form-grid" id="add-machine-form">
    <label>Name
      <input type="text" name="name" required />
    </label>

    <label>Location
      <input type="text" name="location" required />
    </label>

    <label>Install Date
      <input type="date" name="install_date" required />
    </label>

    <label>Temperature
      <input type="number" step="0.1" name="temperature" required />
    </label>

    <label>Pressure
      <input type="number" step="0.1" name="pressure" required />
    </label>

    <label>Vibration
      <input type="number" step="0.1" name="vibration" required />
    </label>

    <label>Humidity
      <input type="number" step="0.1" name="humidity" required />
    </label>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Save Machine</button>
      <a class="btn btn-ghost" href="{{ url_for('index') }}">Back</a>
    </div>
  </form>
  <script>
    // Prevent accidental submit on Enter; move focus to the next field.
    const form = document.getElementById("add-machine-form");
    const order = Array.from(
      form.querySelectorAll("input, button[type='submit']")
    );

    form.addEventListener("keydown", (event) => {
      if (event.key !== "Enter") return;
      if (event.target.tagName === "BUTTON") return;

      event.preventDefault();
      const index = order.indexOf(event.target);
      if (index >= 0 && index < order.length - 1) {
        order[index + 1].focus();
      }
    });
  </script>
</section>
{% endblock %}
